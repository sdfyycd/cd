<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>可拖拽+搜索 · 个人导航站 | 自助增删链接</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e2e8f0 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            padding: 1.8rem 2rem 2rem;
            transition: all 0.2s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e9edf2;
            padding-bottom: 1rem;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1f3b4c, #2c6e9e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            background: white;
            border: 1px solid #cbdde9;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            color: #1f5e7e;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .btn-primary {
            background: #2c6e9e;
            border-color: #2c6e9e;
            color: white;
        }
        .btn-primary:hover {
            background: #1f557a;
            transform: translateY(-1px);
        }
        .btn-outline:hover {
            background: #eef3fc;
            border-color: #9bb7d0;
        }
        
        /* 搜索栏区域 */
        .search-section {
            margin-bottom: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .search-box {
            flex: 2;
            min-width: 200px;
            display: flex;
            align-items: center;
            background: white;
            border-radius: 60px;
            border: 1px solid #cbdde9;
            padding: 0.2rem 0.2rem 0.2rem 1rem;
            transition: 0.2s;
        }
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            padding: 8px 8px;
            font-size: 0.9rem;
            background: transparent;
        }
        .search-box button {
            background: #2c6e9e;
            border: none;
            color: white;
            border-radius: 40px;
            padding: 6px 20px;
            cursor: pointer;
            font-weight: 500;
        }
        .clear-search {
            background: #eef2f5;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            color: #4f6f8f;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .stats {
            background: #eef3fa;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            font-size: 0.75rem;
            color: #2c5a74;
            display: inline-block;
        }

        /* 卡片网格 */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
            margin: 1rem 0 2rem;
        }
        .link-card {
            background: white;
            border-radius: 24px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.9rem;
            transition: all 0.2s ease;
            border: 1px solid #eef2f8;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            position: relative;
            cursor: grab;
            user-select: none;
        }
        .link-card:active {
            cursor: grabbing;
        }
        .link-card.dragging {
            opacity: 0.4;
            cursor: grabbing;
        }
        .link-card.drag-over {
            border: 2px dashed #2c6e9e;
            background: #f5fafe;
            transform: scale(0.99);
        }
        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.1);
            border-color: #cbdde9;
        }
        .favicon {
            width: 44px;
            height: 44px;
            background: #f0f4fa;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 600;
            color: #2c6e9e;
            flex-shrink: 0;
            font-family: monospace;
        }
        .link-info {
            flex: 1;
            overflow: hidden;
        }
        .link-title {
            font-weight: 700;
            font-size: 1rem;
            color: #1f3b4c;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .link-url {
            font-size: 0.7rem;
            color: #7a8f9e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-actions {
            display: flex;
            gap: 8px;
            opacity: 0.6;
            transition: 0.1s;
        }
        .link-card:hover .card-actions {
            opacity: 1;
        }
        .action-icon {
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 4px;
            border-radius: 30px;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #5c6f87;
        }
        .action-icon:hover {
            background: #f1f5f9;
            color: #1f3b4c;
        }
        .delete-icon:hover {
            color: #d1453b;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            background: #fbfefe;
            border-radius: 2rem;
            color: #9aaebf;
            grid-column: 1 / -1;
        }
        .search-highlight {
            background-color: #ffe5b4;
            font-weight: 700;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: white;
            max-width: 480px;
            width: 90%;
            border-radius: 2rem;
            padding: 1.8rem;
            box-shadow: 0 30px 40px rgba(0,0,0,0.2);
        }
        .modal-card h3 {
            font-size: 1.4rem;
            margin-bottom: 1.2rem;
            color: #1f3b4c;
        }
        .input-group {
            margin-bottom: 1.2rem;
        }
        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #406e8e;
        }
        .input-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 60px;
            border: 1px solid #cbdbe0;
            font-size: 0.9rem;
            outline: none;
        }
        .input-group input:focus {
            border-color: #2c6e9e;
            box-shadow: 0 0 0 2px rgba(44,110,158,0.2);
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 1.5rem;
        }
        .btn-modal {
            padding: 8px 20px;
            border-radius: 40px;
            border: none;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-cancel {
            background: #f0f2f5;
        }
        .btn-save {
            background: #2c6e9e;
            color: white;
        }

        .footer-bar {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: #95aec9;
            border-top: 1px solid #e3eaf1;
            padding-top: 1.2rem;
        }
        @media (max-width: 640px) {
            .nav-container { padding: 1rem; }
            .header { flex-direction: column; align-items: stretch; }
            .toolbar { justify-content: flex-start; }
            .search-section { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div class="nav-container">
    <div class="header">
        <h1>📌 我的导航 · 拖拽排序 + 搜索</h1>
        <div class="toolbar">
            <button class="btn btn-outline" id="exportBtn">导出备份</button>
            <button class="btn btn-primary" id="addLinkBtn">+ 添加链接</button>
        </div>
    </div>
    
    <!-- 搜索栏 -->
    <div class="search-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 根据标题快速筛选..." autocomplete="off">
            <button id="searchBtn">搜索</button>
        </div>
        <button class="clear-search" id="clearSearchBtn">清空筛选</button>
        <div class="stats" id="statsDisplay">✨ 加载中...</div>
    </div>

    <div class="links-grid" id="linksGrid">
        <div class="empty-state">暂无链接，点击“添加链接”开始创建你的导航吧</div>
    </div>
    <div class="footer-bar">
        💡 自助管理：拖拽卡片调整顺序 | 点击 ✎ 编辑 | 🗑️ 删除 | 支持标题实时搜索 | 自动保存至本地
    </div>
</div>

<!-- 模态框 -->
<div id="linkModal" class="modal">
    <div class="modal-card">
        <h3 id="modalTitle">+ 添加新链接</h3>
        <div class="input-group">
            <label>标题</label>
            <input type="text" id="linkTitle" placeholder="例如：医学文献检索" autocomplete="off">
        </div>
        <div class="input-group">
            <label>网址（URL）</label>
            <input type="url" id="linkUrl" placeholder="https:// 或 http://" autocomplete="off">
        </div>
        <div class="input-group">
            <label>图标 (短文本/字母)</label>
            <input type="text" id="linkIcon" placeholder="web / doc / lib" value="link" autocomplete="off">
        </div>
        <div class="modal-buttons">
            <button class="btn-modal btn-cancel" id="cancelModalBtn">取消</button>
            <button class="btn-modal btn-save" id="saveLinkBtn">保存</button>
        </div>
    </div>
</div>

<script>
    // ---------- 可拖拽排序 + 标题搜索 + 增删改查 ----------
    const STORAGE_KEY = 'nav_draggable_search_v4';
    let links = [];            // { id, title, url, icon }
    let editMode = false;
    let editingId = null;
    let currentSearchKeyword = '';   // 当前搜索关键词（高亮用）

    // DOM
    const gridContainer = document.getElementById('linksGrid');
    const statsSpan = document.getElementById('statsDisplay');
    const addBtn = document.getElementById('addLinkBtn');
    const modal = document.getElementById('linkModal');
    const modalTitle = document.getElementById('modalTitle');
    const linkTitleInput = document.getElementById('linkTitle');
    const linkUrlInput = document.getElementById('linkUrl');
    const linkIconInput = document.getElementById('linkIcon');
    const saveBtn = document.getElementById('saveLinkBtn');
    const cancelBtn = document.getElementById('cancelModalBtn');
    const exportBtn = document.getElementById('exportBtn');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const clearSearchBtn = document.getElementById('clearSearchBtn');

    let dragSrcIndex = null;

    // 加载数据
    function loadLinks() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                links = JSON.parse(stored);
                if (!Array.isArray(links)) links = [];
            } catch(e) { links = []; }
        }
        if (!links.length) {
            links = [
                { id: Date.now() + 101, title: 'PubMed 医学文献', url: 'https://pubmed.ncbi.nlm.nih.gov/', icon: 'pub' },
                { id: Date.now() + 102, title: '中华心血管病杂志', url: 'https://cjcv.org.cn/', icon: 'jou' },
                { id: Date.now() + 103, title: 'GitHub 代码库', url: 'https://github.com/', icon: 'git' },
                { id: Date.now() + 104, title: '微信公众平台', url: 'https://mp.weixin.qq.com/', icon: 'wx' }
            ];
            saveToLocal();
        }
        renderGridWithSearch();
    }

    function saveToLocal() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
        updateStats();
    }

    function updateStats() {
        const total = links.length;
        statsSpan.innerHTML = `📋 共 ${total} 个导航 | 拖拽排序 | 支持标题搜索`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // 高亮标题
    function highlightTitle(title, keyword) {
        if (!keyword || keyword.trim() === '') return escapeHtml(title);
        const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${escapedKeyword})`, 'gi');
        return escapeHtml(title).replace(regex, `<span class="search-highlight">$1</span>`);
    }

    // 获取过滤后的links（不改变原始顺序）
    function getFilteredLinks() {
        const kw = currentSearchKeyword.trim().toLowerCase();
        if (!kw) return [...links];
        return links.filter(link => link.title.toLowerCase().includes(kw));
    }

    // 渲染带高亮 和 拖拽属性（整体渲染，保持拖拽可用）
    function renderGridWithSearch() {
        if (!gridContainer) return;
        const filtered = getFilteredLinks();
        if (filtered.length === 0) {
            gridContainer.innerHTML = `<div class="empty-state">🔍 没有找到与“${escapeHtml(currentSearchKeyword)}”相关的链接，试试其他关键词吧</div>`;
            return;
        }
        let html = '';
        // 遍历过滤后的列表，但为了保证拖拽时操作的是原始 links 索引，我们需要存储原始id；拖拽依然基于原始数组。
        // 关键：拖拽重排依赖于 data-index（原始links数组中的索引）。因此需要基于原始links渲染，但隐藏不匹配的卡片。
        // 这样拖拽依然能够正确交换原始顺序，同时符合搜索筛选的视觉。
        // 优化：渲染全部原始links，但不符合搜索条件的设置隐藏 display:none，这样拖拽时不会影响隐藏卡片但依旧保留原始顺序索引。
        // 但是在grid里面隐藏卡片会产生空隙，更好的方式采用css order? 为了简单且拖拽排序正确，采用显示/隐藏方式，再利用辅助样式。
        // 保证拖拽只在可见卡片间进行，并且拖拽结束后重新整理links时也会考虑所有卡片。
        // 实现方案：渲染全部links，对不符合搜索条件的添加 style="display: none;"，符合的显示。由于隐藏卡片依然占据data-index，
        // 用户只能拖动可见卡片，拖拽事件依然基于索引位置，但由于隐藏卡片的存在，可能会错位。
        // 为了更好的体验, 重新实现：在拖拽时如果当前处于搜索状态，先清空搜索再进行拖拽排序? 但那样体验不好。
        // 更稳健: 如果当前有搜索关键词，提示用户清空筛选后再拖拽，或者拖拽时自动清空搜索？暂时采用拖拽前若有筛选，自动清空搜索并提示。
        // 但为了功能平滑，选择在拖拽开始时若搜索激活，则自动清除筛选并重新渲染，让拖拽在完整列表中进行。这是最友好的交互。
        // 以下实现该逻辑。
        if (currentSearchKeyword.trim() !== '') {
            // 临时禁用拖拽时的自动清空？其实为了保证拖拽排序逻辑不混乱，在dragstart检测并清空搜索比较合理。
            // 渲染逻辑仍需完整渲染，但使用filter函数高亮显示。
            // 此处采用受控渲染: 由于links会整体保存，我们在dragstart做清空搜索。
        }
        // 渲染所有links, 但根据搜索关键词决定是否显示和高亮
        let allHtml = '';
        links.forEach((link, idx) => {
            const shouldShow = currentSearchKeyword.trim() === '' || link.title.toLowerCase().includes(currentSearchKeyword.toLowerCase());
            const displayStyle = shouldShow ? '' : 'style="display: none;"';
            const displayIcon = link.icon && link.icon.trim() !== '' ? link.icon.substring(0, 2) : 'li';
            let displayUrl = link.url.length > 45 ? link.url.substring(0, 45) + '...' : link.url;
            const highlightedTitle = highlightTitle(link.title, currentSearchKeyword);
            allHtml += `
                <div class="link-card" data-id="${link.id}" data-index="${idx}" draggable="true" ${displayStyle}>
                    <div class="favicon">${escapeHtml(displayIcon)}</div>
                    <div class="link-info">
                        <div class="link-title">${highlightedTitle}</div>
                        <div class="link-url">${escapeHtml(displayUrl)}</div>
                    </div>
                    <div class="card-actions">
                        <button class="action-icon edit-link" data-id="${link.id}" title="编辑">✎</button>
                        <button class="action-icon delete-link" data-id="${link.id}" title="删除">🗑️</button>
                    </div>
                </div>
            `;
        });
        gridContainer.innerHTML = allHtml;

        // 绑定编辑删除
        document.querySelectorAll('.edit-link').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.getAttribute('data-id'));
                openEditModal(id);
            });
        });
        document.querySelectorAll('.delete-link').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.getAttribute('data-id'));
                deleteLinkById(id);
            });
        });

        // 卡片点击跳转
        document.querySelectorAll('.link-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.classList.contains('action-icon') ||
                    e.target.classList.contains('edit-link') ||
                    e.target.classList.contains('delete-link') ||
                    e.target.closest('.card-actions')) {
                    return;
                }
                const id = parseInt(card.getAttribute('data-id'));
                const targetLink = links.find(l => l.id === id);
                if (targetLink && targetLink.url) {
                    let url = targetLink.url.trim();
                    if (!url.startsWith('http://') && !url.startsWith('https://')) {
                        url = 'https://' + url;
                    }
                    window.open(url, '_blank', 'noopener noreferrer');
                }
            });
        });
        attachDragEvents();
    }

    // 拖拽逻辑增强: 如果有激活搜索，先清空搜索再开始拖拽避免索引错位
    function attachDragEvents() {
        const cards = document.querySelectorAll('.link-card');
        cards.forEach(card => {
            card.setAttribute('draggable', 'true');
            card.removeEventListener('dragstart', handleDragStart);
            card.removeEventListener('dragover', handleDragOver);
            card.removeEventListener('dragenter', handleDragEnter);
            card.removeEventListener('dragleave', handleDragLeave);
            card.removeEventListener('drop', handleDrop);
            card.removeEventListener('dragend', handleDragEnd);
            card.addEventListener('dragstart', handleDragStart);
            card.addEventListener('dragover', handleDragOver);
            card.addEventListener('dragenter', handleDragEnter);
            card.addEventListener('dragleave', handleDragLeave);
            card.addEventListener('drop', handleDrop);
            card.addEventListener('dragend', handleDragEnd);
        });
    }

    function handleDragStart(e) {
        // 如果当前有搜索关键词，自动清空搜索并刷新，然后重新触发拖拽（终止本次，因为dom重建）
        if (currentSearchKeyword.trim() !== '') {
            e.preventDefault();
            alert('拖拽排序前请先清空筛选条件 (点击“清空筛选”)');
            return false;
        }
        const card = e.target.closest('.link-card');
        if (!card) return;
        dragSrcIndex = parseInt(card.getAttribute('data-index'));
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', dragSrcIndex);
        card.classList.add('dragging');
    }

    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
    }
    function handleDragEnter(e) {
        const targetCard = e.target.closest('.link-card');
        if (targetCard && dragSrcIndex !== null && currentSearchKeyword.trim() === '') {
            targetCard.classList.add('drag-over');
        }
    }
    function handleDragLeave(e) {
        const targetCard = e.target.closest('.link-card');
        if (targetCard) targetCard.classList.remove('drag-over');
    }
    function handleDrop(e) {
        e.preventDefault();
        const targetCard = e.target.closest('.link-card');
        if (!targetCard) return;
        if (currentSearchKeyword.trim() !== '') {
            cleanDragStyles();
            return;
        }
        const targetIndex = parseInt(targetCard.getAttribute('data-index'));
        if (dragSrcIndex === null || dragSrcIndex === targetIndex) {
            cleanDragStyles();
            return;
        }
        const [movedItem] = links.splice(dragSrcIndex, 1);
        links.splice(targetIndex, 0, movedItem);
        saveToLocal();
        renderGridWithSearch();   // 重新渲染保留搜索状态（此时搜索关键词为空）
        cleanDragStyles();
    }
    function handleDragEnd(e) {
        cleanDragStyles();
        dragSrcIndex = null;
    }
    function cleanDragStyles() {
        document.querySelectorAll('.link-card').forEach(card => {
            card.classList.remove('dragging', 'drag-over');
        });
    }

    // 搜索逻辑
    function performSearch() {
        currentSearchKeyword = searchInput.value.trim();
        renderGridWithSearch();
        updateStats();
        if (currentSearchKeyword !== '') {
            statsSpan.innerHTML += ` 🔍 筛选: "${escapeHtml(currentSearchKeyword)}"`;
        }
    }
    function clearSearch() {
        searchInput.value = '';
        currentSearchKeyword = '';
        renderGridWithSearch();
        updateStats();
    }

    // 增删改
    function openAddModal() {
        editMode = false;
        editingId = null;
        modalTitle.innerText = '+ 添加新链接';
        linkTitleInput.value = '';
        linkUrlInput.value = '';
        linkIconInput.value = 'link';
        modal.style.display = 'flex';
    }
    function openEditModal(id) {
        const link = links.find(l => l.id === id);
        if (!link) return;
        editMode = true;
        editingId = id;
        modalTitle.innerText = '✎ 编辑链接';
        linkTitleInput.value = link.title;
        linkUrlInput.value = link.url;
        linkIconInput.value = link.icon || 'link';
        modal.style.display = 'flex';
    }
    function saveLink() {
        let title = linkTitleInput.value.trim();
        let url = linkUrlInput.value.trim();
        let icon = linkIconInput.value.trim();
        if (!title) { alert('请填写标题'); return; }
        if (!url) { alert('请填写网址'); return; }
        if (!icon) icon = 'web';
        if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
        if (editMode && editingId !== null) {
            const idx = links.findIndex(l => l.id === editingId);
            if (idx !== -1) links[idx] = { ...links[idx], title, url, icon };
        } else {
            links.push({ id: Date.now(), title, url, icon });
        }
        saveToLocal();
        renderGridWithSearch();
        closeModal();
    }
    function deleteLinkById(id) {
        if (confirm('确定要删除这个导航链接吗？')) {
            links = links.filter(l => l.id !== id);
            saveToLocal();
            renderGridWithSearch();
        }
    }
    function closeModal() {
        modal.style.display = 'none';
        editMode = false;
        editingId = null;
    }
    function exportData() {
        const dataStr = JSON.stringify(links, null, 2);
        const blob = new Blob([dataStr], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `nav_search_backup_${new Date().toISOString().slice(0,19)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert('导出成功，保存为 JSON 备份文件。');
    }
    function addImportButton() {
        const importFileInput = document.createElement('input');
        importFileInput.type = 'file';
        importFileInput.accept = 'application/json';
        importFileInput.style.display = 'none';
        importFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if (Array.isArray(imported)) {
                        links = imported;
                        saveToLocal();
                        clearSearch();
                        alert(`导入成功! 共 ${links.length} 个链接。`);
                    } else alert('文件格式错误');
                } catch (err) { alert('解析失败'); }
                importFileInput.value = '';
            };
            reader.readAsText(file);
        });
        document.body.appendChild(importFileInput);
        const importBtn = document.createElement('button');
        importBtn.className = 'btn btn-outline';
        importBtn.innerText = '导入备份';
        importBtn.style.marginLeft = '8px';
        importBtn.addEventListener('click', () => importFileInput.click());
        const toolbar = document.querySelector('.toolbar');
        if (toolbar && !document.querySelector('.import-btn-added')) {
            importBtn.classList.add('import-btn-added');
            toolbar.appendChild(importBtn);
        }
    }

    function bindEvents() {
        addBtn.addEventListener('click', openAddModal);
        saveBtn.addEventListener('click', saveLink);
        cancelBtn.addEventListener('click', closeModal);
        exportBtn.addEventListener('click', exportData);
        searchBtn.addEventListener('click', performSearch);
        clearSearchBtn.addEventListener('click', clearSearch);
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });
        window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.style.display === 'flex') closeModal(); });
    }

    function init() {
        loadLinks();
        bindEvents();
        addImportButton();
        updateStats();
    }
    init();
</script>
</body>
</html>
