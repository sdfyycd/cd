<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>可置顶导航 · 完整标题提示 | 拖拽/搜索/最多置顶10个</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e2e8f0 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            padding: 1.8rem 2rem 2rem;
            transition: all 0.2s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e9edf2;
            padding-bottom: 1rem;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1f3b4c, #2c6e9e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            background: white;
            border: 1px solid #cbdde9;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            color: #1f5e7e;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .btn-primary {
            background: #2c6e9e;
            border-color: #2c6e9e;
            color: white;
        }
        .btn-primary:hover {
            background: #1f557a;
            transform: translateY(-1px);
        }
        .btn-outline:hover {
            background: #eef3fc;
            border-color: #9bb7d0;
        }
        
        /* 搜索栏区域 */
        .search-section {
            margin-bottom: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .search-box {
            flex: 2;
            min-width: 200px;
            display: flex;
            align-items: center;
            background: white;
            border-radius: 60px;
            border: 1px solid #cbdde9;
            padding: 0.2rem 0.2rem 0.2rem 1rem;
            transition: 0.2s;
        }
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            padding: 8px 8px;
            font-size: 0.9rem;
            background: transparent;
        }
        .search-box button {
            background: #2c6e9e;
            border: none;
            color: white;
            border-radius: 40px;
            padding: 6px 20px;
            cursor: pointer;
            font-weight: 500;
        }
        .clear-search {
            background: #eef2f5;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            color: #4f6f8f;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .stats {
            background: #eef3fa;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            font-size: 0.75rem;
            color: #2c5a74;
            display: inline-block;
        }

        /* 卡片网格 */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
            margin: 1rem 0 2rem;
        }
        .link-card {
            background: white;
            border-radius: 24px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.9rem;
            transition: all 0.2s ease;
            border: 1px solid #eef2f8;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            position: relative;
            cursor: grab;
            user-select: none;
        }
        .link-card.pinned-card {
            background: #fffef7;
            border-left: 5px solid #f5a623;
            box-shadow: 0 4px 12px rgba(245,166,35,0.12);
        }
        .link-card:active {
            cursor: grabbing;
        }
        .link-card.dragging {
            opacity: 0.4;
            cursor: grabbing;
        }
        .link-card.drag-over {
            border: 2px dashed #2c6e9e;
            background: #f5fafe;
            transform: scale(0.99);
        }
        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.1);
            border-color: #cbdde9;
        }
        .favicon {
            width: 44px;
            height: 44px;
            background: #f0f4fa;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c6e9e;
            flex-shrink: 0;
            font-family: monospace;
            text-transform: uppercase;
        }
        .link-info {
            flex: 1;
            overflow: hidden;
        }
        .link-title {
            font-weight: 700;
            font-size: 1rem;
            color: #1f3b4c;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .pin-badge {
            background: #f5a62320;
            color: #c46b1a;
            font-size: 0.65rem;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            font-weight: 600;
            white-space: nowrap;
        }
        .link-url {
            font-size: 0.7rem;
            color: #7a8f9e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-actions {
            display: flex;
            gap: 8px;
            opacity: 0.6;
            transition: 0.1s;
        }
        .link-card:hover .card-actions {
            opacity: 1;
        }
        .action-icon {
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 4px;
            border-radius: 30px;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #5c6f87;
        }
        .action-icon:hover {
            background: #f1f5f9;
            color: #1f3b4c;
        }
        .pin-icon {
            color: #f5a623;
        }
        .pin-icon:hover {
            color: #e08e1a;
        }
        .delete-icon:hover {
            color: #d1453b;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            background: #fbfefe;
            border-radius: 2rem;
            color: #9aaebf;
            grid-column: 1 / -1;
        }
        .search-highlight {
            background-color: #ffe5b4;
            font-weight: 700;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: white;
            max-width: 480px;
            width: 90%;
            border-radius: 2rem;
            padding: 1.8rem;
            box-shadow: 0 30px 40px rgba(0,0,0,0.2);
        }
        .modal-card h3 {
            font-size: 1.4rem;
            margin-bottom: 1.2rem;
            color: #1f3b4c;
        }
        .input-group {
            margin-bottom: 1.2rem;
        }
        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #406e8e;
        }
        .input-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 60px;
            border: 1px solid #cbdbe0;
            font-size: 0.9rem;
            outline: none;
        }
        .input-group input:focus {
            border-color: #2c6e9e;
            box-shadow: 0 0 0 2px rgba(44,110,158,0.2);
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 1.5rem;
        }
        .btn-modal {
            padding: 8px 20px;
            border-radius: 40px;
            border: none;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-cancel {
            background: #f0f2f5;
        }
        .btn-save {
            background: #2c6e9e;
            color: white;
        }

        .footer-bar {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: #95aec9;
            border-top: 1px solid #e3eaf1;
            padding-top: 1.2rem;
        }
        @media (max-width: 640px) {
            .nav-container { padding: 1rem; }
            .header { flex-direction: column; align-items: stretch; }
            .toolbar { justify-content: flex-start; }
            .search-section { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div class="nav-container">
    <div class="header">
        <h1>📌 我的导航</h1>
        <div class="toolbar">
            <button class="btn btn-outline" id="exportBtn">导出备份</button>
            <button class="btn btn-primary" id="addLinkBtn">+ 添加链接</button>
        </div>
    </div>
    
    <div class="search-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 根据标题快速筛选..." autocomplete="off">
            <button id="searchBtn">搜索</button>
        </div>
        <button class="clear-search" id="clearSearchBtn">清空筛选</button>
        <div class="stats" id="statsDisplay">✨ 加载中...</div>
    </div>

    <div class="links-grid" id="linksGrid">
        <div class="empty-state">暂无链接，点击“添加链接”开始创建你的导航吧</div>
    </div>
    <div class="footer-bar">
        💡 自助管理：拖拽调整顺序 | 点击 ⭐ 置顶/取消置顶 (最多10个) | ✎ 编辑 | 🗑️ 删除 | 鼠标悬停显示完整标题/网址 | 自动保存
    </div>
</div>

<!-- 模态框 -->
<div id="linkModal" class="modal">
    <div class="modal-card">
        <h3 id="modalTitle">+ 添加新链接</h3>
        <div class="input-group">
            <label>标题</label>
            <input type="text" id="linkTitle" placeholder="例如：医学文献检索" autocomplete="off">
        </div>
        <div class="input-group">
            <label>网址（URL）</label>
            <input type="url" id="linkUrl" placeholder="https:// 或 http://" autocomplete="off">
        </div>
        <div class="modal-buttons">
            <button class="btn-modal btn-cancel" id="cancelModalBtn">取消</button>
            <button class="btn-modal btn-save" id="saveLinkBtn">保存</button>
        </div>
    </div>
</div>

<script>
    // ========== 置顶功能：最多10个，支持拖拽排序时保持置顶优先，鼠标悬停显示完整标题/地址 ==========
    const STORAGE_KEY = 'nav_pin_tooltip_v7';
    let links = [];            // 每个元素 { id, title, url, pinned }
    let editMode = false;
    let editingId = null;
    let currentSearchKeyword = '';
    let dragSrcIndex = null;

    // DOM
    const gridContainer = document.getElementById('linksGrid');
    const statsSpan = document.getElementById('statsDisplay');
    const addBtn = document.getElementById('addLinkBtn');
    const modal = document.getElementById('linkModal');
    const modalTitle = document.getElementById('modalTitle');
    const linkTitleInput = document.getElementById('linkTitle');
    const linkUrlInput = document.getElementById('linkUrl');
    const saveBtn = document.getElementById('saveLinkBtn');
    const cancelBtn = document.getElementById('cancelModalBtn');
    const exportBtn = document.getElementById('exportBtn');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const clearSearchBtn = document.getElementById('clearSearchBtn');

    // 辅助函数：获取排序后的列表（置顶优先）
    function reorderLinksByPin() {
        const pinned = links.filter(l => l.pinned);
        const normal = links.filter(l => !l.pinned);
        links = [...pinned, ...normal];
    }

    function getInitial(title) {
        if (!title) return 'L';
        const first = title.trim().charAt(0).toUpperCase();
        if (/[A-Za-z0-9\u4e00-\u9fa5]/.test(first)) return first;
        return '⚡';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function highlightTitle(title, keyword) {
        if (!keyword || keyword.trim() === '') return escapeHtml(title);
        const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${escapedKeyword})`, 'gi');
        return escapeHtml(title).replace(regex, `<span class="search-highlight">$1</span>`);
    }

    function getFilteredIndices() {
        const kw = currentSearchKeyword.trim().toLowerCase();
        if (!kw) return links.map((_, idx) => idx);
        return links.reduce((arr, link, idx) => {
            if (link.title.toLowerCase().includes(kw)) arr.push(idx);
            return arr;
        }, []);
    }

    function saveToLocalAndReorder() {
        reorderLinksByPin();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
        updateStats();
    }

    function saveToLocal() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
        updateStats();
    }

    function updateStats() {
        const pinnedCount = links.filter(l => l.pinned).length;
        statsSpan.innerHTML = `📋 共 ${links.length} 个导航 | 置顶 ${pinnedCount}/10 | 拖拽排序 | 支持搜索`;
        if (currentSearchKeyword.trim() !== '') {
            const filteredCount = getFilteredIndices().length;
            statsSpan.innerHTML = `📋 共 ${links.length} 个导航 | 置顶 ${pinnedCount}/10 | 筛选结果: ${filteredCount} 个匹配 “${escapeHtml(currentSearchKeyword)}”`;
        }
    }

    function togglePin(id) {
        const link = links.find(l => l.id === id);
        if (!link) return;
        const currentPinnedCount = links.filter(l => l.pinned).length;
        if (!link.pinned && currentPinnedCount >= 10) {
            alert(`置顶数量已达上限 (10个)，请先取消其他链接的置顶后再试。`);
            return;
        }
        link.pinned = !link.pinned;
        saveToLocalAndReorder();
        renderGridWithSearch();
    }

    function loadLinks() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                links = JSON.parse(stored);
                if (!Array.isArray(links)) links = [];
                links.forEach(link => { if (link.pinned === undefined) link.pinned = false; });
            } catch(e) { links = []; }
        }
        if (!links.length) {
            links = [
                { id: Date.now() + 101, title: 'PubMed 医学文献数据库 (生物医学文献检索)', url: 'https://pubmed.ncbi.nlm.nih.gov/', pinned: true },
                { id: Date.now() + 102, title: '中华心血管病杂志官网', url: 'https://cjcv.org.cn/', pinned: false },
                { id: Date.now() + 103, title: 'GitHub 全球代码托管平台', url: 'https://github.com/', pinned: false },
                { id: Date.now() + 104, title: '微信公众平台官方后台', url: 'https://mp.weixin.qq.com/', pinned: false }
            ];
            saveToLocalAndReorder();
        }
        reorderLinksByPin();
        renderGridWithSearch();
    }

    // 核心渲染，并为每个卡片增加 title 属性（鼠标悬停显示完整标题+网址）
    function renderGridWithSearch() {
        if (!gridContainer) return;
        if (links.length === 0) {
            gridContainer.innerHTML = `<div class="empty-state">✨ 暂无链接，点击“添加链接”开始创建你的导航吧</div>`;
            return;
        }
        const filteredIndices = getFilteredIndices();
        let allHtml = '';
        links.forEach((link, idx) => {
            const shouldShow = filteredIndices.includes(idx);
            const displayStyle = shouldShow ? '' : 'style="display: none;"';
            const displayIcon = getInitial(link.title);
            let displayUrl = link.url.length > 45 ? link.url.substring(0, 45) + '...' : link.url;
            const highlightedTitle = highlightTitle(link.title, currentSearchKeyword);
            const pinnedClass = link.pinned ? 'pinned-card' : '';
            const pinBadgeHtml = link.pinned ? `<span class="pin-badge">⭐ 置顶</span>` : '';
            // 构建完整的 tooltip 文本：原始标题 + 完整网址
            const tooltipText = `${link.title}\n${link.url}`;
            allHtml += `
                <div class="link-card ${pinnedClass}" data-id="${link.id}" data-index="${idx}" draggable="true" ${displayStyle} title="${escapeHtml(tooltipText)}">
                    <div class="favicon">${escapeHtml(displayIcon)}</div>
                    <div class="link-info">
                        <div class="link-title">
                            ${highlightedTitle}
                            ${pinBadgeHtml}
                        </div>
                        <div class="link-url">${escapeHtml(displayUrl)}</div>
                    </div>
                    <div class="card-actions">
                        <button class="action-icon pin-link" data-id="${link.id}" title="${link.pinned ? '取消置顶' : '置顶 (最多10个)'}">⭐</button>
                        <button class="action-icon edit-link" data-id="${link.id}" title="编辑">✎</button>
                        <button class="action-icon delete-link" data-id="${link.id}" title="删除">🗑️</button>
                    </div>
                </div>
            `;
        });
        gridContainer.innerHTML = allHtml;

        // 绑定事件
        document.querySelectorAll('.pin-link').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.getAttribute('data-id'));
                togglePin(id);
            });
        });
        document.querySelectorAll('.edit-link').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.getAttribute('data-id'));
                openEditModal(id);
            });
        });
        document.querySelectorAll('.delete-link').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.getAttribute('data-id'));
                deleteLinkById(id);
            });
        });
        document.querySelectorAll('.link-card').forEach(card => {
            // 点击打开链接（避开按钮区域）
            card.addEventListener('click', (e) => {
                if (e.target.classList.contains('action-icon') ||
                    e.target.classList.contains('pin-link') ||
                    e.target.classList.contains('edit-link') ||
                    e.target.classList.contains('delete-link') ||
                    e.target.closest('.card-actions')) {
                    return;
                }
                const id = parseInt(card.getAttribute('data-id'));
                const targetLink = links.find(l => l.id === id);
                if (targetLink && targetLink.url) {
                    let url = targetLink.url.trim();
                    if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
                    window.open(url, '_blank', 'noopener noreferrer');
                }
            });
        });
        attachDragEvents();
        updateStats();
    }

    // 拖拽逻辑（置顶与置顶交换，普通与普通交换）
    function attachDragEvents() {
        const cards = document.querySelectorAll('.link-card');
        cards.forEach(card => {
            card.setAttribute('draggable', 'true');
            card.removeEventListener('dragstart', handleDragStart);
            card.removeEventListener('dragover', handleDragOver);
            card.removeEventListener('dragenter', handleDragEnter);
            card.removeEventListener('dragleave', handleDragLeave);
            card.removeEventListener('drop', handleDrop);
            card.removeEventListener('dragend', handleDragEnd);
            card.addEventListener('dragstart', handleDragStart);
            card.addEventListener('dragover', handleDragOver);
            card.addEventListener('dragenter', handleDragEnter);
            card.addEventListener('dragleave', handleDragLeave);
            card.addEventListener('drop', handleDrop);
            card.addEventListener('dragend', handleDragEnd);
        });
    }

    function handleDragStart(e) {
        if (currentSearchKeyword.trim() !== '') {
            e.preventDefault();
            alert('拖拽排序前请先清空筛选条件 (点击“清空筛选”)');
            return false;
        }
        const card = e.target.closest('.link-card');
        if (!card) return;
        dragSrcIndex = parseInt(card.getAttribute('data-index'));
        if (isNaN(dragSrcIndex)) return;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', dragSrcIndex);
        card.classList.add('dragging');
    }
    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
    }
    function handleDragEnter(e) {
        const targetCard = e.target.closest('.link-card');
        if (targetCard && dragSrcIndex !== null && currentSearchKeyword.trim() === '') {
            targetCard.classList.add('drag-over');
        }
    }
    function handleDragLeave(e) {
        const targetCard = e.target.closest('.link-card');
        if (targetCard) targetCard.classList.remove('drag-over');
    }
    function handleDrop(e) {
        e.preventDefault();
        const targetCard = e.target.closest('.link-card');
        if (!targetCard) return;
        if (currentSearchKeyword.trim() !== '') {
            cleanDragStyles();
            return;
        }
        const targetIndex = parseInt(targetCard.getAttribute('data-index'));
        if (dragSrcIndex === null || dragSrcIndex === targetIndex) {
            cleanDragStyles();
            return;
        }
        const srcPinned = links[dragSrcIndex].pinned;
        const targetPinned = links[targetIndex].pinned;
        if (srcPinned !== targetPinned) {
            alert('置顶链接只能与置顶链接交换顺序，非置顶同理。如需改变置顶状态请使用⭐按钮。');
            cleanDragStyles();
            return;
        }
        const [movedItem] = links.splice(dragSrcIndex, 1);
        links.splice(targetIndex, 0, movedItem);
        saveToLocalAndReorder();
        renderGridWithSearch();
        cleanDragStyles();
    }
    function handleDragEnd(e) {
        cleanDragStyles();
        dragSrcIndex = null;
    }
    function cleanDragStyles() {
        document.querySelectorAll('.link-card').forEach(card => {
            card.classList.remove('dragging', 'drag-over');
        });
    }

    function performSearch() {
        currentSearchKeyword = searchInput.value.trim();
        renderGridWithSearch();
    }
    function clearSearch() {
        searchInput.value = '';
        currentSearchKeyword = '';
        renderGridWithSearch();
    }

    function openAddModal() {
        editMode = false;
        editingId = null;
        modalTitle.innerText = '+ 添加新链接';
        linkTitleInput.value = '';
        linkUrlInput.value = '';
        modal.style.display = 'flex';
    }
    function openEditModal(id) {
        const link = links.find(l => l.id === id);
        if (!link) return;
        editMode = true;
        editingId = id;
        modalTitle.innerText = '✎ 编辑链接';
        linkTitleInput.value = link.title;
        linkUrlInput.value = link.url;
        modal.style.display = 'flex';
    }
    function saveLink() {
        let title = linkTitleInput.value.trim();
        let url = linkUrlInput.value.trim();
        if (!title) { alert('请填写标题'); return; }
        if (!url) { alert('请填写网址'); return; }
        if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
        if (editMode && editingId !== null) {
            const idx = links.findIndex(l => l.id === editingId);
            if (idx !== -1) { links[idx].title = title; links[idx].url = url; }
        } else {
            links.push({ id: Date.now(), title, url, pinned: false });
        }
        saveToLocalAndReorder();
        renderGridWithSearch();
        closeModal();
    }
    function deleteLinkById(id) {
        if (confirm('确定要删除这个导航链接吗？')) {
            links = links.filter(l => l.id !== id);
            saveToLocalAndReorder();
            renderGridWithSearch();
        }
    }
    function closeModal() {
        modal.style.display = 'none';
        editMode = false;
        editingId = null;
    }
    function exportData() {
        const dataStr = JSON.stringify(links, null, 2);
        const blob = new Blob([dataStr], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `nav_pin_backup_${new Date().toISOString().slice(0,19)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert('导出成功，保存为 JSON 备份文件。');
    }
    function addImportButton() {
        const importFileInput = document.createElement('input');
        importFileInput.type = 'file';
        importFileInput.accept = 'application/json';
        importFileInput.style.display = 'none';
        importFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if (Array.isArray(imported)) {
                        imported.forEach(link => { if (link.pinned === undefined) link.pinned = false; });
                        links = imported;
                        saveToLocalAndReorder();
                        clearSearch();
                        alert(`导入成功! 共 ${links.length} 个链接。`);
                    } else alert('文件格式错误');
                } catch (err) { alert('解析失败'); }
                importFileInput.value = '';
            };
            reader.readAsText(file);
        });
        document.body.appendChild(importFileInput);
        const importBtn = document.createElement('button');
        importBtn.className = 'btn btn-outline';
        importBtn.innerText = '导入备份';
        importBtn.style.marginLeft = '8px';
        importBtn.addEventListener('click', () => importFileInput.click());
        const toolbar = document.querySelector('.toolbar');
        if (toolbar && !document.querySelector('.import-btn-added')) {
            importBtn.classList.add('import-btn-added');
            toolbar.appendChild(importBtn);
        }
    }

    function bindEvents() {
        addBtn.addEventListener('click', openAddModal);
        saveBtn.addEventListener('click', saveLink);
        cancelBtn.addEventListener('click', closeModal);
        exportBtn.addEventListener('click', exportData);
        searchBtn.addEventListener('click', performSearch);
        clearSearchBtn.addEventListener('click', clearSearch);
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });
        window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.style.display === 'flex') closeModal(); });
    }

    function init() {
        loadLinks();
        bindEvents();
        addImportButton();
    }
    init();
</script>
</body>
</html>
